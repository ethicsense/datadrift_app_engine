[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftstudio_reports"
version = "0.1.0"
description = "driftstudio_reports package for drift_studio"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "jinja2>=3.1.0,<4.0.0",
  "weasyprint>=62.0,<63.0",
  "pydyf<0.11",
  "driftstudio_spec>=0.1.0",
]

[tool.setuptools]
packages = {find = {where = ["packages"], include = ["driftstudio_reports*"]}}
