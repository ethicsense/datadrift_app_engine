[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddoc-plugin-mlflow-log"
version = "1.0.0"
description = "MLflow log analysis plugin for ddoc"
requires-python = ">=3.9"
dependencies = [
    "pluggy>=1.5.0",
    "pyyaml>=6.0",
]

[project.entry-points."ddoc"]
ddoc_mlflow_log = "ddoc_plugin_mlflow_log.mlflow_log_impl:DOCMlflowLogPlugin"

[tool.setuptools]
packages = {find = {where = ["."], include = ["ddoc_plugin_mlflow_log*"]}}
include-package-data = true
zip-safe = false
