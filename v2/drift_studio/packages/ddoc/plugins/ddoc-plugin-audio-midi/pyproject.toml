[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddoc-plugin-audio-midi"
version = "1.0.0"
description = "Audio(MIDI) analysis plugin for ddoc (midi+json symbolic feature analysis, drift detection)"
requires-python = ">=3.9"
dependencies = [
    "pluggy>=1.5.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pyyaml>=6.0",
]

[project.entry-points."ddoc"]
ddoc_audio_midi = "ddoc_plugin_audio_midi.midi_impl:DOCAudioMidiPlugin"

[tool.setuptools]
packages = {find = {where = ["."], include = ["ddoc_plugin_audio_midi*"]}}
include-package-data = true
zip-safe = false

