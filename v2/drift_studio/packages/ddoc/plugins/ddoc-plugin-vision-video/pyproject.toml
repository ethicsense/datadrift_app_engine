[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddoc-plugin-vision-video"
version = "1.0.0"
description = "Vision(Video) analysis plugin for ddoc (ffmpeg sampling, frame quality + temporal metrics)"
requires-python = ">=3.9"
dependencies = [
    "pluggy>=1.5.0",
    "numpy>=1.21.0",
    "pillow>=9.0.0",
    "pyyaml>=6.0",
]

[project.entry-points."ddoc"]
ddoc_vision_video = "ddoc_plugin_vision_video.video_impl:DDOCVisionVideoPlugin"

[tool.setuptools]
packages = {find = {where = ["."], include = ["ddoc_plugin_vision_video*"]}}
include-package-data = true
zip-safe = false

