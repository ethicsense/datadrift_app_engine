[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftstudio_spec"
version = "0.1.0"
description = "driftstudio_spec package for drift_studio"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[tool.setuptools]
packages = {find = {where = ["packages"], include = ["driftstudio_spec*"]}}
