[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftstudio-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "python-multipart",
  "sqlalchemy",
  "jinja2",
  "pydantic>=2.7",
  "weasyprint>=62.0,<63.0",
  "pydyf<0.11",
  "pyyaml>=6.0.0,<7.0.0",
  "driftstudio_runtime>=0.1.0",
  "driftstudio_spec>=0.1.0",
  "driftstudio_reports>=0.1.0",
]

[tool.setuptools]
packages = {find = {where = ["."], include = ["app*"]}}
