# 브랜드 이미지 스타일 축 — 앵커 문장(임베딩 프로토타입용)
# axis_id는 API·키워드 경로와 동일하게 유지한다.
version: "1"

axes:
  - axis_id: minimal
    label_ko: "미니멀/심플"
    anchor_texts:
      - "불필요한 디테일을 줄인 미니멀한 실루엣이다."
      - "심플하고 단정한 디자인이 매력적이다."
      - "클린한 무드의 베이직 아이템이다."

  - axis_id: chic
    label_ko: "시크/세련"
    anchor_texts:
      - "도회적이고 세련된 분위기가 난다."
      - "무난하지 않은 시크한 무드다."
      - "urban하고 글램한 인상이다."

  - axis_id: street
    label_ko: "스트릿"
    anchor_texts:
      - "스트릿 무드와 힙한 실루엣이다."
      - "그래픽과 오버핏이 어우러진 스트릿 룩이다."
      - "스케이트보드 문화에서 온 캐주얼 스트릿 스타일이다."

  - axis_id: casual
    label_ko: "캐주얼/데일리"
    anchor_texts:
      - "데일리로 입기 좋은 편안한 캐주얼이다."
      - "일상에서 부담 없이 입을 수 있는 루즈한 핏이다."
      - "이지하고 릴렉스된 분위기다."

  - axis_id: sporty
    label_ko: "스포츠/애슬레저"
    anchor_texts:
      - "운동과 일상을 겸한 애슬레저 무드다."
      - "러닝이나 헬스에 어울리는 스포티한 착용감이다."
      - "짐웨어 감성의 기능적인 스포츠 룩이다."

  - axis_id: americana
    label_ko: "아메카지/워크"
    anchor_texts:
      - "아메카지와 워크웨어 무드가 느껴진다."
      - "밀리터리와 데님의 클래식한 조합이다."
      - "빈티지 워크 재킷 감성이다."

  - axis_id: formal
    label_ko: "포멀/오피스"
    anchor_texts:
      - "오피스와 포멀한 자리에 어울린다."
      - "비즈니스 캐주얼에 맞는 단정한 실루엣이다."
      - "드레시한 인상의 셔츠 룩이다."

  - axis_id: feminine
    label_ko: "페미닌"
    anchor_texts:
      - "페미닌하고 로맨틱한 분위기다."
      - "프릴과 레이스가 들어간 여성스러운 디테일이다."
      - "러블리한 실루엣이 돋보인다."

  - axis_id: luxury
    label_ko: "럭셔리/프리미엄"
    anchor_texts:
      - "하이엔드한 퀄리티와 럭셔리한 마감이다."
      - "프리미엄 소재의 고급스러운 광택이 있다."
      - "명품 라인에서 볼 법한 디테일이다."

  - axis_id: retro
    label_ko: "레트로/빈티지"
    anchor_texts:
      - "90년대 감성의 레트로한 실루엣이다."
      - "빈티지한 워싱과 올드스쿨 무드다."
      - "y2k 스타일의 그래픽이 포인트다."

  - axis_id: outdoor
    label_ko: "아웃도어/고프코어"
    anchor_texts:
      - "캠핑과 등산에 어울리는 아웃도어 기능이다."
      - "고프코어 무드의 방풍·발수 소재다."
      - "아웃도어 브랜드에서 흔히 보는 실루엣이다."
