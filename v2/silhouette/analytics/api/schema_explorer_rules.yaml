# schema_explorer_rules.yaml
# 스키마 탐색기에서 "탐색 대상에서 제외"할 필드를 정의합니다.
#
# 목적:
# - 원문에 존재하지만 아직 분석에 활용하지 않는 후보 필드를 빠르게 찾기 위함.
# - 이미 "상품 정보" 탭에서 다루는 product_info 계열 필드는 탐색 노이즈를 줄이기 위해 제외.
#
# 적용 범위:
# - exclude_raw_prefixes: raw 스키마 필드명 prefix 기준 제외
# - exclude_normalized_fields: normalized 스키마 필드명 exact match 제외

exclude_raw_prefixes:
  # product_info.* 는 상품 정보 탭에서 이미 처리/활용 중인 원문 필드
  - product_info.

exclude_normalized_fields:
  # 상품 정보 속성 원문/정규화 컬럼
  - material
  - color
  - manufacturer
  - origin_country
  - shipping_fee
  - color_normalized
  - material_normalized

  # 상품 정보 커버리지/주소 파생 컬럼
  - product_info_exists
  - business_address
  - business_province
  - business_district
  - business_dong
