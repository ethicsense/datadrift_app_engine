[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddoc"
version = "1.0.3"
description = "데이터 드리프트 관리 기술의 기반 프레임워크"
authors = [
    {name = "KETI", email = "contact@keti.re.kr"}
]
readme = "README_PYPI.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["data-drift", "machine-learning", "ai", "data-analysis", "computer-vision"]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.0.0",
    "scikit-image>=0.19.0",
    "scipy>=1.7.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pillow>=8.3.0",
    "opencv-python>=4.5.0",
    "yellowbrick>=1.4.0",
    "fpdf>=1.7.0",
    "streamlit>=1.20.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "flask-socketio>=5.0.0",
    "plotly>=5.0.0",
    "umap-learn>=0.5.0",
    "tqdm>=4.60.0",
    "ftfy",
    "regex",
    "tiktoken",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "black>=21.0.0",
    "flake8>=3.8.0",
    "mypy>=0.800",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.scripts]
ddoc = "main:main"

[project.urls]
Homepage = "https://github.com/keti-datadrift/datadrift_app_engine"
Repository = "https://github.com/keti-datadrift/datadrift_app_engine"
"Bug Tracker" = "https://github.com/keti-datadrift/datadrift_app_engine/issues"
Documentation = "https://github.com/keti-datadrift/datadrift_app_engine#readme"

[tool.setuptools]
py-modules = ["main", "trdg_converter"]
packages = ["data_utils", "cache_utils", "report_generator", "clip", "flask_webapp"]
include-package-data = true
zip-safe = false


[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.yml", "*.yaml"]

# 개발 도구 설정
[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | datadoctor_cli_test
  | notebooks
  | point-e
  | yolo_cam
  | flask_webapp
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.coverage.run]
source = ["data_utils", "cache_utils", "report_generator"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "datadoctor_cli_test/*",
    "notebooks/*",
    "point-e/*",
    "yolo_cam/*",
    "flask_webapp/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
