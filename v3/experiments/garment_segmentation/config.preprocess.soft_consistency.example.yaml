schema_version: 1
# Soft-mask consistency ladders (pad_ratio × blur σ), one factor at a time.
# Sibling of attribute_cluster_eval-20261002 under artifacts/garment_segmentation/
date: 2026-10-07
output_root: artifacts/garment_segmentation
project_id: soft_consistency_pad_blur-20261007
# Cohort / labels / SAM3 caches live in the 20261002 hub (read-only source).
source_cohort_dir: artifacts/garment_segmentation/attribute_cluster_eval-20261002
source_bank: sam3_abcd
# Reuse embeddings from prior soft_sweep bank when settings match.
reuse_bank: sam3_soft_sweep
encoder_id: Marqo/marqo-fashionSigLIP
device: auto
batch_size: 8
seed: 42
box_model: sam3
box_resolver: combined
mask_model: sam3
mask_resolver: combined
sam3_runs:
  - sam3-mps-450-expanded
  - sam3-mps-supp211
  - sam3-mps-expand293-recovered
  - sam3-mps-topup49
  - sam3-mps-topup36
  - sam3-mps-topup28
preprocess:
  # Fixed when not the swept axis.
  dilate_px: 7
  alpha_sigma: 5.0
  min_mask_fill: 0.08
  garment_labels:
    - shirt
    - hoodie
    - sweater
    - blouse
    - t-shirt
    - short-sleeve top
    - long-sleeve top
    - sweatshirt
    - sleeveless top
    - tank top
    - sports bra
    - dress
    - top
# pad_ratio ladder (dilate=7, blur=21). soft_ref is the middle rung.
pad_ladder:
  - {name: pad_r0, pad_ratio: 0.0, dilate_px: 7, background_blur_sigma: 21.0}
  - {name: pad_r06, pad_ratio: 0.06, dilate_px: 7, background_blur_sigma: 21.0}
  - {name: soft_ref, pad_ratio: 0.12, dilate_px: 7, background_blur_sigma: 21.0, reuse_from: C_0}
  - {name: pad_r20, pad_ratio: 0.20, dilate_px: 7, background_blur_sigma: 21.0}
  - {name: pad_r30, pad_ratio: 0.30, dilate_px: 7, background_blur_sigma: 21.0}
# blur σ ladder (pad=0.12, dilate=7). soft_ref shared with pad middle.
blur_ladder:
  - {name: blur_s04, pad_ratio: 0.12, dilate_px: 7, background_blur_sigma: 4.0}
  - {name: blur_s08, pad_ratio: 0.12, dilate_px: 7, background_blur_sigma: 8.0, reuse_from: C_2}
  - {name: soft_ref, pad_ratio: 0.12, dilate_px: 7, background_blur_sigma: 21.0, reuse_from: C_0}
  - {name: blur_s40, pad_ratio: 0.12, dilate_px: 7, background_blur_sigma: 40.0, reuse_from: C_blur40}
  - {name: blur_s60, pad_ratio: 0.12, dilate_px: 7, background_blur_sigma: 60.0}
preview_item_ids:
  - 3cd64dfc19420475
  - 7aaccf9badfc256e
  - cb0571ddec533d9f
