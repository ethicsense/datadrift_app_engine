<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataDrift App Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
        }
        .btn-container {
            margin-top: 2rem;
            display: flex;
            gap: 3rem;
            justify-content: center;
        }
        .btn-large {
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 15px;
            transition: all 0.3s ease;
            text-align: center;
            padding: 0;
            white-space: normal;
            word-wrap: break-word;
            background-color: white;
            color: #333;
            border: 2px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .btn-large::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn-large:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border-color: #999;
        }
        .btn-large:hover::before {
            opacity: 0.4;
        }
        .btn-large span {
            position: relative;
            z-index: 1;
            font-weight: 800;
            text-shadow: 
                -1px -1px 0 #fff,
                1px -1px 0 #fff,
                -1px 1px 0 #fff,
                1px 1px 0 #fff;
        }
        .cam-btn::before {
            background-image: url('/static/images/cam_vis.png');
        }
        .sampler-btn::before {
            background-image: url('/static/images/data_sampler.png');
        }
        
        h1 {
            margin-bottom: 3rem;
            color: #2c3e50;
            font-size: 3.5rem;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(to right, #3498db, #2ecc71);
            border-radius: 2px;
        }

        .title-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .title-container::before {
            content: 'DataDoctor';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: #7f8c8d;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
        }

        .main-image {
            width: 400px;
            height: auto;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/images/main.png" alt="Main Image" class="main-image">
        <div class="title-container">
            <h1>Diagnosis</h1>
        </div>
        <div class="btn-container">
            <a href="{{ url_for('cam_upload') }}" class="btn btn-large cam-btn">
                <span>C.A.M Vis</span>
            </a>
            <a href="{{ url_for('init_data') }}" class="btn btn-large sampler-btn">
                <span>Train Pipeline</span>
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
